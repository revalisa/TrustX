
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="judul deskripsi">

  <title id="judul">Ilustrasi Keamanan Akun</title>
  <desc id="deskripsi">
    Perisai dan gembok melambangkan perlindungan akun
    dan keamanan transaksi digital.
  </desc>

  <rect width="800" height="520" rx="28" fill="#F0F4FF"></rect>

  <circle cx="400" cy="245" r="190" fill="#E0E7FF"></circle>
  <circle cx="400" cy="245" r="150" fill="#D4DDFF"></circle>

  <!-- Perisai -->
  <path d="M400 76 L535 128 L520 270
           Q500 350 400 405
           Q300 350 280 270 L265 128 Z" fill="#5B4BDB"></path>

  <path d="M400 104 L507 145 L495 266
