<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - TrusX</title>
</head>

<body>
    <header>
        <a href="../index.html"><img src="../assets/images/trusx-logo.svg" alt="TrustX Cek Dulu - ke beranda" width="60" height="60"></a>
        <p>TrustX</p>
        <nav aria-label="Menu Pembeli">
        <ul>
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="register-buyer.html">Daftar</a></li>
            <li><a href="login-buyer.html">Masuk</a></li>
        </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Masuk ke TrustX</h1>

            <p>
                Masuk ke akun kamu untuk menggunakan fitur laporan
                dan berkontribusi dalam komunitas TrustX.
            </p>

            <form action="laporanpage.html" method="post">
                <fieldset>
                    <legend>Informasi Login</legend>

                    <p>
                        <label for="username">Username</label><br>
                        <input type="text" id="username" name="username" placeholder="Masukkan Username" autocomplete="off" required>
                    </p>

                    <p>
                        <label for="password">Password</label><br>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                        >
                    </p>

                    <p>
                        <label>
                            <input
                                type="checkbox"
                                name="ingat_saya"
                            >
                            Ingat saya
                        </label>
                    </p>

                    <button type="submit">Masuk</button>
                </fieldset>
            </form>

            <p>
                Lupa password?
                <a href="#">Reset password</a>
            </p>

            <p>
                Belum memiliki akun?
                <a href="register-buyer.html">Daftar sekarang</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TrustX. Semua hak dilindungi.</p>
    </footer>

</body>
</html>
